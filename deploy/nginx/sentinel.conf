# Nginx delante de SENTINEL (requiere sudo):
#   sudo cp deploy/nginx/sentinel.conf /etc/nginx/sites-available/sentinel
#   sudo ln -s /etc/nginx/sites-available/sentinel /etc/nginx/sites-enabled/sentinel
#   sudo nginx -t && sudo systemctl reload nginx
# Cambie server_name por su dominio. Para HTTPS: sudo certbot --nginx -d su-dominio
server {
    listen 80;
    server_name sentinel.local;

    # Los lotes etiquetados pueden pesar varios MB
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/csv;

    # Entrenar una candidata tarda unos segundos
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
