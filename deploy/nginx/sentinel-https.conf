# Nginx con HTTPS para SENTINEL (reemplaza a sentinel.conf cuando ya existe el certificado).
#
# El certificado lo emite Let's Encrypt con verificación por DNS (acme.sh + API de Name.com), así funciona aunque el
# servidor solo sea accesible en la red local. Debe estar en /home/bello/certs/ (ver "HTTPS" en el README):
#   /home/bello/certs/sentinel.bello.works.crt   (cadena completa)
#   /home/bello/certs/sentinel.bello.works.key
#
#   sudo cp deploy/nginx/sentinel-https.conf /etc/nginx/sites-available/sentinel
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP: el dominio redirige a HTTPS; el nombre nip.io (sin certificado) sigue sirviendo por HTTP
server {
    listen 80;
    server_name sentinel.bello.works;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name sentinel.192.168.120.60.nip.io;
    include /home/bello/sentinel/deploy/nginx/sentinel-proxy.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sentinel.bello.works;

    ssl_certificate     /home/bello/certs/sentinel.bello.works.crt;
    ssl_certificate_key /home/bello/certs/sentinel.bello.works.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SENTINEL:10m;
    ssl_session_timeout 1d;

    # Cabeceras de seguridad. HSTS empieza en 1 día; súbalo a 1 año (31536000) cuando todo esté estable.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /home/bello/sentinel/deploy/nginx/sentinel-proxy.inc;
}
